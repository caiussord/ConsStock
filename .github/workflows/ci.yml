name: CI
on:
  push:
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: consstock_test
          POSTGRES_USER: consstock
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U consstock -d consstock_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_CONNECTION: Host=localhost;Port=5432;Database=consstock_test;Username=consstock
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore ConsStock.sln
      - run: dotnet build ConsStock.sln --no-restore --configuration Release
      - run: dotnet test ConsStock.sln --no-build --configuration Release
