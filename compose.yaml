services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: consstock
      POSTGRES_USER: consstock
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U consstock -d consstock"]
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    build: .
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Host=db;Port=5432;Database=consstock;Username=consstock;Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      Database__ApplyMigrations: "true"
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
